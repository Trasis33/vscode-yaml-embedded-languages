name: pipeline

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate injections.scm
        run: python3 generate.py

      - name: Ensure generator output is committed
        run: |
          if ! git diff --quiet; then
            echo "::error::languages/yaml/injections.scm is out of date."
            echo "Run 'python3 generate.py' locally and commit the result."
            git --no-pager diff
            exit 1
          fi
