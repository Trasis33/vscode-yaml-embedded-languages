# Mirrors Zed's built-in YAML language configuration so that Zed loads this
# extension's ``languages/yaml/injections.scm`` when opening ``.yaml`` / ``.yml``
# files. Keep in sync with:
#   https://github.com/zed-industries/zed/blob/main/crates/grammars/src/yaml/config.toml
name = "YAML"
grammar = "yaml"
path_suffixes = ["yml", "yaml", "pixi.lock", "clang-format", "clangd", "bst"]
modeline_aliases = ["yml"]
line_comments = ["# "]
autoclose_before = ",]}"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string"] },
]

auto_indent_on_paste = false
auto_indent_using_last_non_empty_line = false
# 1st block matches basic elements followed by ':' like 'test: '.
# 2nd block matches the first element in an array if it's an object,
# for example:
# ```yaml
# test:
#   - first: one
# ```
increase_indent_pattern = "(:?^[^#]*:\\s*[|>]?\\s*$)|(:?^\\s*-[^#]*:\\s*(:?#+.*)$)"
prettier_parser_name = "yaml"
tab_size = 2
